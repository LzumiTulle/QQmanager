name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build and verify only the Windows x64 installer
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_only && '["windows-2025"]' || '["macos-15","macos-15-intel","windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -B -m unittest discover -s tests
      - run: python -B -m unittest discover -s tests -p test_ocr_native.py
        env:
          QQMANAGER_TEST_OCR: '1'
      - run: node --test tests/*.test.cjs
      - run: python scripts/desktop/build_backend.py
      - run: python scripts/desktop/smoke_backend.py
      - if: runner.os == 'macOS'
        run: python scripts/build_mac_installer.py
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run dist:${{ runner.os == 'Windows' && 'win' || 'mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: python scripts/desktop/smoke_windows_install.py
      - run: python scripts/desktop/audit_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: QQmanager-${{ runner.os == 'Windows' && 'win' || 'mac' }}-${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          find artifacts -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \)) SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --prerelease --title "QQmanager $TAG 试用版" --notes "macOS / Windows 桌面试用版。未配置商业代码签名；Windows QQ 插件兼容性尚未实测。请阅读 README 和平台限制。" $(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \)) SHA256SUMS.txt
          fi
