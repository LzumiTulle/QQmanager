name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-2025
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: python -B -m unittest discover -s tests
      - run: python -B -m unittest discover -s tests -p test_ocr_native.py
        env:
          QQMANAGER_TEST_OCR: '1'
      - run: node --test tests/desktop.test.cjs tests/native_plugin.test.cjs
      - run: python scripts/desktop/build_backend.py
      - run: python scripts/desktop/smoke_backend.py
      - if: runner.os == 'macOS'
        run: python scripts/build_mac_installer.py
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: python scripts/desktop/smoke_windows_install.py
      - run: python scripts/desktop/audit_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: QQmanager-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          find artifacts -name SHA256SUMS.txt -exec cat {} + > SHA256SUMS.txt
          gh release create "$TAG" --draft --prerelease --title "QQmanager $TAG 试用版" --notes "macOS / Windows 桌面试用版。未配置商业代码签名；Windows QQ 插件兼容性尚未实测。请阅读 README 和平台限制。" $(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \)) SHA256SUMS.txt
