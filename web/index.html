<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QQmanager · 把重要的事留下</title>
  <meta name="description" content="本地聊天信息助手，整理重要消息、文件和待办。">
  <link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a href="#home" class="brand"><span class="brand-icon">Q<span>·</span></span><span>QQmanager<small>你的群聊信息助手</small></span></a>
    <div class="workspace"><span class="workspace-icon">私</span><div>我的信息空间<small>仅保存在这台电脑</small></div><span class="dot"></span></div>
    <div class="nav-label">工作空间</div>
    <nav aria-label="主导航">
      <button data-view="home"><span>◈</span>信息概览</button>
      <button data-view="insights"><span>✧</span>重要信息<i id="nav-insights">0</i></button>
      <button data-view="files"><span>▤</span>文件资料<i id="nav-files">0</i></button>
      <button data-view="tasks"><span>☑</span>待办提醒<i id="nav-tasks">0</i></button>
      <button data-view="messages"><span>☷</span>原始记录</button>
    </nav>
    <div class="nav-label second">管理</div>
    <nav><button data-view="connections"><span>⇄</span>自动接入<span class="tiny-label">NEW</span></button><button data-view="settings"><span>⚙</span>关注与设置</button></nav>
    <div class="sidebar-bottom"><span class="small-orbit">✳</span><strong>让消息少一点，重点多一点。</strong><p>本地保存 · 原文可追溯<br>你的信息，由你掌握。</p><span class="version">LOCAL EDITION / V0.2</span></div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb">我的空间 <span>/</span> <b id="crumb">信息概览</b></div><div class="top-actions"><span class="local-pill"><span class="dot"></span>本地运行</span><button id="notifications-button" class="icon-button" aria-label="查看提醒">♧<span id="notification-count"></span></button><span class="avatar">我</span></div></header>
    <div class="page">
      <section class="page-heading"><div><div class="eyebrow" id="eyebrow">YOUR INFORMATION, IN FOCUS</div><h1 id="page-title">把重要的事留下。</h1><p id="page-description">从热闹的群聊里，找到与你有关的信息。</p></div><button class="primary" id="import-button"><span>＋</span> 导入内容</button></section>
      <div id="notice" role="status" hidden></div>
      <div class="searchbar" id="searchbar"><span>⌕</span><input id="search" placeholder="搜索消息、文件正文或关键词…" aria-label="搜索内容"><kbd>⌘ K</kbd><select id="group-filter" aria-label="筛选群聊"><option value="">全部群聊</option></select></div>
      <div id="content" aria-live="polite"></div>
      <footer>QQmanager <span>·</span> AI 与规则辅助整理，结果请结合原文确认 <span class="footer-right">把注意力留给重要的事 ↗</span></footer>
    </div>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
